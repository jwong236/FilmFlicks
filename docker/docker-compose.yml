version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx
    container_name: nginx-proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"  # Publicly expose port 80 for the webpage
    volumes:
      - ./nginx-config/nginx.conf:/etc/nginx/nginx.conf  # Mount reverse proxy configuration
    networks:
      - app_network

  # Backend Service
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: filmflicks-backend
    # No exposed ports; backend is private and only accessible via Nginx
    volumes:
      - ../backend/src/main/resources/application-secret.properties:/app/config/application-secret.properties
    depends_on:
      moviedb:
        condition: service_healthy
    networks:
      - app_network

  # Frontend Service
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: filmflicks-frontend
    # No exposed ports; frontend is proxied through Nginx
    volumes:
      - ./nginx-config/default.conf:/etc/nginx/conf.d/default.conf  # Mount frontend Nginx configuration
    env_file:
      - ../frontend/.env.production
    networks:
      - app_network

  # Database Service
  moviedb:
    image: mysql:8.0
    container_name: filmflicks-moviedb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: moviedb
    # No exposed ports; database is private and only accessible by the backend
    volumes:
      - ./01-create-table.sql:/docker-entrypoint-initdb.d/01-create-table.sql
      - ./02-add-star.sql:/docker-entrypoint-initdb.d/02-add-star.sql
      - ./03-add-movie.sql:/docker-entrypoint-initdb.d/03-add-movie.sql
      - ./04-delete-movie.sql:/docker-entrypoint-initdb.d/04-delete-movie.sql
      - ./05-delete-star.sql:/docker-entrypoint-initdb.d/05-delete-star.sql
      - ./06-movie-data.sql:/docker-entrypoint-initdb.d/06-movie-data.sql
      - my-db:/var/lib/mysql
    command: ["--general-log=ON", "--general-log-file=/var/lib/mysql/general.log", "--log-error=/var/lib/mysql/error.log"]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  my-db:

networks:
  app_network:

